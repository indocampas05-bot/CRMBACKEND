
spring.application.name=crm-backend
server.port=5000
server.address=0.0.0.0
server.servlet.context-path=/

# MongoDB Connection
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

# CORS Configuration
app.cors.allowed-origins=*

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.indocrm.crm=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.data.mongodb.auto-index-creation=true

# Server
server.error.include-message=always
server.error.include-binding-errors=always

# WebSocket
spring.websocket.server.origins=*

# OpenRouter API Configuration
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.model=openrouter/free

# Google Meet OAuth Configuration
google.meet.client-id=${GOOGLE_MEET_CLIENT_ID}
google.meet.client-secret=${GOOGLE_MEET_CLIENT_SECRET}
google.meet.redirect-uri=${GOOGLE_MEET_REDIRECT_URI}

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Bridge API Configuration
bridge.api-key=${BRIDGE_API_KEY}
